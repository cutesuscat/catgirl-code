name: Catgirl Code release

# Builds what the apps install on a machine, from this repository at a tag:
# the server archives, SHA256SUMS, the installer script and the Mac app.
# Catgirl Code is an unofficial fork of T3 Code. Nothing here is signed by
# Apple. The Mac app carries the fork's own signature (secrets
# CATGIRL_MAC_SIGNING_P12 and CATGIRL_MAC_SIGNING_P12_PASSWORD), which is what
# lets an installed copy update itself from these releases.
#
# Release: set CATGIRL_BUILD (and CATGIRL_UPSTREAM_VERSION after moving to a
# newer T3 Code) in packages/shared/src/catgirlRelease.ts, commit, then push
# the tag `node scripts/catgirl-release.ts version` prints, with a "v" in front.
# The tag is the plain version (v1.12.1) the apps download by; the title and
# the Mac file carry the letter version people see (0.1.12a).
# Rehearse: run this workflow by hand; it builds the same files into a draft.
#
# The Android app is not built here. It is signed on the maintainer's machine
# with a key that never leaves it, and attached to the release afterwards:
#   gh release upload v<version> Catgirl-Code-<android version>.apk

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
  workflow_dispatch:

concurrency:
  group: catgirl-release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  # The public values that point a build at a Catgirl Connect service. Repository
  # variables; leave them unset to build with Connect off until a user enters one.
  T3CODE_RELAY_URL: ${{ vars.T3CODE_RELAY_URL }}
  T3CODE_CLERK_PUBLISHABLE_KEY: ${{ vars.T3CODE_CLERK_PUBLISHABLE_KEY }}
  T3CODE_CLERK_JWT_TEMPLATE: ${{ vars.T3CODE_CLERK_JWT_TEMPLATE }}
  T3CODE_CLERK_CLI_OAUTH_CLIENT_ID: ${{ vars.T3CODE_CLERK_CLI_OAUTH_CLIENT_ID }}
  # SHA-1 of the Mac app's signing certificate ("Catgirl Code Releases"). Public;
  # the certificate and its key are in the secrets.
  CATGIRL_MAC_SIGNING_IDENTITY: 36D36A618B3A343FE94F5A8F1738771E30A2042E

jobs:
  # One server archive per platform, each built and started on its own hardware.
  # linux-x64 is what the maintainer's machines run and must succeed. The other
  # two are built the same way and may fail without holding the release back.
  server:
    name: Server ${{ matrix.key }}
    runs-on: ${{ matrix.runner }}
    continue-on-error: ${{ matrix.optional }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - key: linux-x64
            runner: ubuntu-24.04
            platform: linux
            arch: x64
            rust_target: x86_64-unknown-linux-gnu
            optional: false
          - key: linux-arm64
            runner: ubuntu-24.04-arm
            platform: linux
            arch: arm64
            rust_target: aarch64-unknown-linux-gnu
            optional: true
          - key: darwin-arm64
            runner: macos-26
            platform: mac
            arch: arm64
            rust_target: aarch64-apple-darwin
            optional: true
    steps:
      # By hand: the vendored .repos tree has orphaned gitlinks that break actions/checkout.
      - name: Checkout
        shell: bash
        run: |
          set -euo pipefail
          git init .
          git remote add origin "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git"
          git fetch --no-tags --depth=1 origin "${GITHUB_SHA}"
          git sparse-checkout set --no-cone '/*' '!/.repos/'
          git checkout --detach FETCH_HEAD

      - uses: actions/setup-node@v4
        with:
          node-version-file: package.json

      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail
          npm install -g "$(node -p "require('./package.json').packageManager")"
          pnpm install --frozen-lockfile
          # The build scripts start `vp` by name; upstream installs it globally with its own setup action.
          echo "$GITHUB_WORKSPACE/node_modules/.bin" >> "$GITHUB_PATH"

      # The tag must be the version in the source: apps ask for exactly that release.
      - id: version
        name: Resolve the version
        shell: bash
        run: |
          set -euo pipefail
          version="$(node scripts/catgirl-release.ts version)"
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            node scripts/catgirl-release.ts check-tag "$GITHUB_REF_NAME"
          fi
          node scripts/update-release-package-versions.ts "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      # t3#build also builds the web client into apps/server/dist/client.
      - name: Build the server bundle and web client
        run: pnpm exec vp run --filter t3 build

      - name: Build the resource monitor
        run: cargo build --locked --release --manifest-path native/resource-monitor/Cargo.toml --target "${{ matrix.rust_target }}"

      - name: Build the single executable
        shell: bash
        run: |
          set -euo pipefail
          node scripts/apply-web-brand-assets.ts production apps/server/dist/client
          node apps/server/scripts/cli.ts build-exe --verbose

      # The Linux archive ships libatomic.so.1 and points t3's RUNPATH at it.
      - name: Install patchelf
        if: matrix.platform == 'linux'
        run: command -v patchelf || { sudo apt-get update && sudo apt-get install -y patchelf; }

      # No signing identity is configured, so the macOS executable is signed ad hoc.
      - name: Build the archive
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          monitor="$RUNNER_TEMP/resource-monitor/${{ matrix.key }}"
          mkdir -p "$monitor"
          cp "native/resource-monitor/target/${{ matrix.rust_target }}/release/t3-resource-monitor" "$monitor/"
          node scripts/build-cli-archive.ts \
            --platform "${{ matrix.platform }}" \
            --arch "${{ matrix.arch }}" \
            --version "$VERSION" \
            --resource-monitor-dir "$RUNNER_TEMP/resource-monitor" \
            --output-dir release-cli

      - name: Start the archive's server
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: node scripts/smoke-cli-archive.ts --archive release-cli/* --expect-version "$VERSION"

      # What a machine gets must be this fork: its name, its release address, and no usage reports.
      - name: Check it is Catgirl Code
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          unpacked="$RUNNER_TEMP/unpacked"
          mkdir -p "$unpacked" "$RUNNER_TEMP/home"
          tar -xzf release-cli/*.tar.gz -C "$unpacked" --strip-components=1
          export HOME="$RUNNER_TEMP/home" T3CODE_HOME="$RUNNER_TEMP/home/t3" NO_COLOR=1
          [[ "$("$unpacked/t3" --version)" == "t3 v$VERSION" ]]
          "$unpacked/t3" --help > help.txt
          grep -q "Catgirl Code" help.txt
          grep -rq "TELEMETRY_ON_BY_DEFAULT = false" apps/server/dist
          grep -rqF "$(node scripts/catgirl-release.ts repository)/releases" apps/server/dist
          refuse() {
            if grep -rqF "$1" "${@:2}"; then
              echo "::error::found \"$1\" in the build"
              exit 1
            fi
          }
          # `t3 feedback` names T3 Code's team on purpose: it is one of the recipients a person can choose.
          tr '\n' ' ' < help.txt | tr -s ' ' | sed -e 's/T3 Code team//g' -e 's/about T3 Code itself//g' > help-names.txt
          refuse "T3 Code" help-names.txt
          refuse "pingdotgg/t3code/releases" apps/server/dist --include='*.mjs' --exclude-dir=client

      - uses: actions/upload-artifact@v4
        with:
          name: cli-${{ matrix.key }}
          path: release-cli/*.tar.gz
          if-no-files-found: error
          compression-level: 0

  # The arm64 Mac app, signed with the fork's own certificate and with an update
  # feed on this repository's releases. macOS installs an update only when it is
  # signed like the running app, so every release must keep this certificate:
  # a new one would leave every installed copy unable to update.
  mac:
    name: Mac app
    runs-on: macos-26
    timeout-minutes: 90
    steps:
      - name: Checkout
        shell: bash
        run: |
          set -euo pipefail
          git init .
          git remote add origin "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git"
          git fetch --no-tags --depth=1 origin "${GITHUB_SHA}"
          git sparse-checkout set --no-cone '/*' '!/.repos/'
          git checkout --detach FETCH_HEAD

      - uses: actions/setup-node@v4
        with:
          node-version-file: package.json

      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail
          npm install -g "$(node -p "require('./package.json').packageManager")"
          pnpm install --frozen-lockfile
          # The build scripts start `vp` by name; upstream installs it globally with its own setup action.
          echo "$GITHUB_WORKSPACE/node_modules/.bin" >> "$GITHUB_PATH"

      - id: version
        name: Resolve the version
        shell: bash
        run: |
          set -euo pipefail
          version="$(node scripts/catgirl-release.ts version)"
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            node scripts/catgirl-release.ts check-tag "$GITHUB_REF_NAME"
          fi
          node scripts/update-release-package-versions.ts "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      # A keychain of its own for this run, removed again before the checks.
      - name: Import the signing certificate
        shell: bash
        env:
          SIGNING_P12: ${{ secrets.CATGIRL_MAC_SIGNING_P12 }}
          SIGNING_P12_PASSWORD: ${{ secrets.CATGIRL_MAC_SIGNING_P12_PASSWORD }}
        run: |
          set -euo pipefail
          if [[ -z "$SIGNING_P12" || -z "$SIGNING_P12_PASSWORD" ]]; then
            echo "::error::CATGIRL_MAC_SIGNING_P12 is not set: without it the app could not take the next release as an update"
            exit 1
          fi
          keychain="$RUNNER_TEMP/catgirl-signing.keychain-db"
          password="$(openssl rand -hex 24)"
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          printf '%s' "$SIGNING_P12" | base64 --decode > "$RUNNER_TEMP/signing.p12"
          security import "$RUNNER_TEMP/signing.p12" -k "$keychain" -P "$SIGNING_P12_PASSWORD" -T /usr/bin/codesign
          rm -f "$RUNNER_TEMP/signing.p12"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$password" "$keychain" > /dev/null
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          security find-identity -p codesigning "$keychain"
          if ! security find-identity -p codesigning "$keychain" | grep -qi "$CATGIRL_MAC_SIGNING_IDENTITY"; then
            echo "::error::the certificate in the secrets is not $CATGIRL_MAC_SIGNING_IDENTITY"
            exit 1
          fi
          echo "CATGIRL_MAC_SIGNING_KEYCHAIN=$keychain" >> "$GITHUB_ENV"

      # scripts/catgirl-mac-after-pack.ts signs the app before the disk image and
      # the update zip are made from it.
      - name: Build the arm64 disk image and update zip
        shell: bash
        env:
          T3CODE_DESKTOP_SIGNED: "false"
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: |
          set -euo pipefail
          # The update feed written into the app: this fork's releases, wherever this runs.
          T3CODE_DESKTOP_UPDATE_REPOSITORY="$(node scripts/catgirl-release.ts repository)"
          export T3CODE_DESKTOP_UPDATE_REPOSITORY
          pnpm dist:desktop:dmg:arm64

      - name: Check it is Catgirl Code
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          ls -la release
          count() { { grep -rl --exclude='*.map' "$@" || true; } | wc -l | tr -d ' '; }
          [[ "$(count "T3 Connect" apps/server/dist)" == "0" ]]
          [[ "$(count "Catgirl Code" apps/server/dist/client/assets)" != "0" ]]
          grep -rq "TELEMETRY_ON_BY_DEFAULT = false" apps/server/dist
          # The server it gives a machine comes from the fork's releases, never from T3 Code's.
          grep -rqF "$(node scripts/catgirl-release.ts repository)/releases" apps/desktop/dist-electron
          if grep -rqF "pingdotgg/t3code/releases" apps/desktop/dist-electron apps/server/dist --include='*.cjs' --include='*.mjs' --exclude-dir=client; then
            echo "::error::the build still names T3 Code's releases"
            exit 1
          fi

      # What an installed app downloads: the zip. Checked here as a Mac that never had the
      # certificate sees it, so the keychain goes first.
      - name: Check the signature and the update feed
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          security delete-keychain "$CATGIRL_MAC_SIGNING_KEYCHAIN"
          repository="$(node scripts/catgirl-release.ts repository)"
          unpacked="$RUNNER_TEMP/update-zip"
          rm -rf "$unpacked" && mkdir -p "$unpacked"
          ditto -x -k "release/T3-Code-$VERSION-arm64.zip" "$unpacked"
          app="$(find "$unpacked" -maxdepth 1 -name '*.app' -print -quit)"
          test -n "$app"
          codesign --verify --deep --strict --verbose=2 "$app"
          codesign --display --verbose=2 "$app" 2>&1 | grep -E '^(Identifier|Authority|Signature|TeamIdentifier)'
          requirement="$(codesign --display --requirements - "$app" 2>&1 | sed -n 's/^designated => //p')"
          echo "designated requirement: $requirement"
          # The test an installed copy applies to an update: the bundle and this certificate, never one build's hash.
          if [[ "$requirement" == *cdhash* ]] || ! grep -qi "$CATGIRL_MAC_SIGNING_IDENTITY" <<< "$requirement"; then
            echo "::error::the app is not signed with the fork's certificate"
            exit 1
          fi
          codesign --verify --deep --strict -R="=$requirement" "$app"
          feed="$app/Contents/Resources/app-update.yml"
          cat "$feed"
          grep -qx "provider: github" "$feed"
          grep -qx "owner: ${repository%%/*}" "$feed"
          grep -qx "repo: ${repository##*/}" "$feed"
          cat release/latest-mac.yml
          grep -qx "version: $VERSION" release/latest-mac.yml

      # The packager names the files after T3 Code; a fork's downloads are not called that.
      # The update zip keeps the plain version, which the updater uses to find the last
      # release's blockmap; the disk image people download has the letter version.
      - name: Name the files
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          letters="$(node scripts/catgirl-release.ts letter-version)"
          zip_from="T3-Code-$VERSION-arm64.zip" zip_to="Catgirl-Code-$VERSION-arm64.zip"
          dmg_from="T3-Code-$VERSION-arm64.dmg" dmg_to="Catgirl-Code-$letters-arm64.dmg"
          mv "release/$zip_from" "release/$zip_to"
          mv "release/$zip_from.blockmap" "release/$zip_to.blockmap"
          mv "release/$dmg_from" "release/$dmg_to"
          sed -i '' -e "s/$zip_from/$zip_to/g" -e "s/$dmg_from/$dmg_to/g" release/latest-mac.yml
          cat release/latest-mac.yml
          if grep -q "T3-Code" release/latest-mac.yml; then
            echo "::error::latest-mac.yml still names a file the release will not have"
            exit 1
          fi
          for file in $(sed -n 's/^ *- url: //p; s/^path: //p' release/latest-mac.yml); do
            test -f "release/$file"
          done

      - uses: actions/upload-artifact@v4
        with:
          name: mac-arm64
          path: |
            release/Catgirl-Code-*.dmg
            release/Catgirl-Code-*.zip
            release/Catgirl-Code-*.zip.blockmap
            release/latest-mac.yml
          if-no-files-found: error
          compression-level: 0

  release:
    name: Publish the release
    needs: [server, mac]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - name: Checkout
        shell: bash
        run: |
          set -euo pipefail
          git init .
          git remote add origin "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git"
          git fetch --no-tags --depth=1 origin "${GITHUB_SHA}"
          git sparse-checkout set --no-cone '/*' '!/.repos/'
          git checkout --detach FETCH_HEAD

      - uses: actions/setup-node@v4
        with:
          node-version-file: package.json

      - name: Install the scripts' dependencies
        shell: bash
        run: |
          set -euo pipefail
          npm install -g "$(node -p "require('./package.json').packageManager")"
          pnpm install --frozen-lockfile --filter @t3tools/scripts...

      - uses: actions/download-artifact@v4
        with:
          pattern: cli-*
          merge-multiple: true
          path: release-assets

      - uses: actions/download-artifact@v4
        with:
          name: mac-arm64
          path: release-assets

      # The apps and the installer verify an archive against this file, in sha256sum's own format.
      - name: Write checksums and the installer
        shell: bash
        run: |
          set -euo pipefail
          cd release-assets
          version="$(node ../scripts/catgirl-release.ts version)"
          test -f "t3-$version-linux-x64.tar.gz"
          sha256sum t3-*.tar.gz > SHA256SUMS
          cat SHA256SUMS
          node ../scripts/catgirl-release.ts install-script install.sh
          sh -n install.sh
          ls -la

      - name: Write the release notes
        shell: bash
        run: |
          set -euo pipefail
          version="$(node scripts/catgirl-release.ts version)"
          letters="$(node scripts/catgirl-release.ts letter-version)"
          upstream="$(node scripts/catgirl-release.ts upstream-version)"
          cat > release-notes.md <<EOF
          Catgirl Code $letters, an unofficial fork of [T3 Code](https://github.com/pingdotgg/t3code) based on T3 Code $upstream. It is not affiliated with, endorsed by or supported by T3 Tools, Inc.

          Machines know this release as version $version (tag \`v$version\`): that is the number \`t3 --version\` prints and \`t3 update\` takes. The apps show $letters.

          - **Server** (\`t3-$version-<platform>.tar.gz\`): the apps download and start it on a machine they reach over SSH. To install it by hand: \`curl -fsSL $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/download/v$version/install.sh | T3CODE_VERSION=$version sh\`
          - **Mac** (\`.dmg\`, Apple Silicon): not signed by Apple. After copying it to Applications the first time, run \`xattr -cr "/Applications/Catgirl Code.app"\` once. From 0.1.12c on, the app updates itself from these releases: it asks before it downloads and before it restarts. (The \`.zip\` and \`latest-mac.yml\` are what it downloads.)
          - **Android** (\`.apk\`): attached after the build, signed with the maintainer's key.

          Nothing here is signed by Apple or notarized. The Mac app is signed with Catgirl Code's own certificate (SHA-1 \`$CATGIRL_MAC_SIGNING_IDENTITY\`), and an installed copy accepts only updates signed with it. \`SHA256SUMS\` lists the server archives.
          EOF
          cat release-notes.md

      # A draft first: its files are not public, so no app sees the release before
      # every file is attached. A run started by hand stops at the draft.
      - name: Publish
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          version="$(node scripts/catgirl-release.ts version)"
          letters="$(node scripts/catgirl-release.ts letter-version)"
          tag="v$version"
          # The apps fetch from the repository named in the source. Releasing anywhere else reaches nobody.
          if ! node scripts/catgirl-release.ts check-repository "$GITHUB_REPOSITORY"; then
            [[ "$GITHUB_REF_TYPE" != "tag" ]] || exit 1
            echo "::warning::rehearsal in a repository the apps do not fetch from"
          fi
          # A draft left by a rehearsal is replaced. A published release is never touched.
          if [[ "$(gh release view "$tag" --json isDraft --jq .isDraft 2>/dev/null || true)" == "true" ]]; then
            gh release delete "$tag" --yes
          fi
          gh release create "$tag" --draft --target "$GITHUB_SHA" \
            --title "Catgirl Code $letters" --notes-file release-notes.md \
            release-assets/*.tar.gz release-assets/SHA256SUMS release-assets/install.sh release-assets/*.dmg \
            release-assets/*.zip release-assets/*.zip.blockmap release-assets/latest-mac.yml
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            gh release edit "$tag" --draft=false --latest
          else
            echo "::notice::Draft release $tag created. Publish it by pushing the tag, or delete the draft."
          fi
